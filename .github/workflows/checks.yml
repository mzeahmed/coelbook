# Continuous integration: verifies every push and pull request. The API
# must be formatted, pass go vet and the tests, and build; the frontend must
# pass ESLint, type-check and build.
name: Checks

# Run on pushes to any branch but main, and on every pull request. main
# only receives code through pull requests, which were already checked
# here before merging, so re-running on the merge push would be redundant.
on:
  push:
    branches-ignore:
      - main

  pull_request:

# Read-only checkout is all this workflow needs.
permissions:
  contents: read

jobs:
  api:
    name: API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Reads the Go version from go.mod instead of hardcoding one here,
          # so this workflow can never drift out of sync with the module.
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Format
        run: go fmt ./...

      - name: Check formatting
        # go fmt above rewrites any misformatted file in place. If it
        # touched anything, the checkout is now dirty and this diff is
        # non-empty, which fails the step (git diff --exit-code returns 1
        # when there are differences).
        run: git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Same major version as the production image (Dockerfile).
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # Type-checks (tsc -b) then builds, exactly like the production image.
      - name: Type-check and build
        run: npm run build
