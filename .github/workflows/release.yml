# Release: pushing a version tag publishes the production image and the
# GitHub release.
#
#   git tag -a v0.2.0 -m "Coelbook v0.2.0" && git push origin v0.2.0
#
# The tag must have a "## [x.y.z] - date" section in CHANGELOG.md: it
# becomes the release notes, and the release fails without it. See
# docs/releases/versioning.md.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write # create the GitHub release
  packages: write # push the image to ghcr.io

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # First, so a missing changelog entry stops the release before
      # anything is published.
      - name: Release notes from CHANGELOG.md
        run: ./scripts/changelog-section.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v0.2.0 → 0.2.0, 0.2 and latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both platforms build natively (the Dockerfile cross-compiles), so no
      # QEMU step is needed.
      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Coelbook ${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --verify-tag
