openapi: 3.0.3
info:
  title: Coelbook API
  description: API for the Coelbook incident knowledge-base platform.
  version: 0.1.0
servers:
- url: http://localhost:8080
  description: Local development server
tags:
- name: Categories
  description: Incident categories (requires authentication). A default set is created by migration.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Envelope:
      description: Standard JSON response wrapper used by every endpoint.
      type: object
      properties:
        code:
          type: integer
          description: HTTP status code.
        success:
          type: boolean
          description: Whether the request succeeded (true for 2xx).
        error:
          type: string
          description: 'Stable, machine-readable error code, present on error responses only. Clients should branch on (and translate) this code rather than parse `message`, whose wording may change.

            '
          enum:
          - invalid_request_body
          - internal_error
          - missing_token
          - invalid_token
          - route_not_found
          - method_not_allowed
          - admin_name_required
          - admin_email_required
          - admin_password_too_short
          - instance_name_required
          - instance_timezone_required
          - instance_locale_required
          - already_initialized
          - credentials_required
          - invalid_credentials
          - email_required
          - reset_token_required
          - password_too_short
          - invalid_reset_token
          - incident_not_found
          - title_required
          - title_too_long
          - invalid_status
          - category_required
          - unknown_category
          - too_many_tags
          - too_many_snippets
          - snippet_title_required
          - snippet_content_required
          - too_many_links
          - link_url_required
          - invalid_link_url
          - category_name_required
          - category_name_too_long
          - category_description_too_long
          - category_name_taken
          - category_not_found
          - category_in_use
          - tag_not_found
          - tag_name_required
          - tag_name_too_long
          - tag_name_invalid
          - tag_exists
          - tag_merge_target_required
          - tag_merge_into_itself
          - first_name_required
          - last_name_required
          - name_too_long
          - invalid_email
          - email_taken
          - current_password_required
          - wrong_current_password
          - instance_name_too_long
          - invalid_timezone
          - invalid_locale
          - not_initialized
        field:
          type: string
          description: 'Path of the request field a validation error is about, present on such errors only. Dots separate nested fields and brackets hold list indexes, e.g. `title` or `snippets[2].content`.

            '
          example: snippets[2].content
        message:
          type: string
          description: Human-readable (English) status message, for developers and logs.
        data:
          description: Payload (varies per endpoint).
      required:
      - code
      - success
      - message
    Category:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        incident_count:
          type: integer
          format: int64
          description: Number of incidents in this category (any status).
      required:
      - name
      - slug
      - description
      - incident_count
    CategoryWriteRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: Unique, compared case-insensitively.
        description:
          type: string
          maxLength: 500
      required:
      - name
  responses:
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 400
            success: false
            error: invalid_request_body
            message: invalid request body
            data: null
    Unauthorized:
      description: Missing or invalid Bearer token / invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 401
            success: false
            error: invalid_credentials
            message: invalid email or password
            data: null
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 404
            success: false
            error: incident_not_found
            message: incident not found
            data: null
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 500
            success: false
            error: internal_error
            message: internal server error
            data: null
paths:
  /categories:
    post:
      operationId: createCategory
      tags:
      - Categories
      summary: Create a category
      description: The slug is derived from the name and suffixed (-2, -3, …) if already taken.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryWriteRequest'
      responses:
        '201':
          description: The created category.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: '`category_name_taken`: another category has this name.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: listCategories
      tags:
      - Categories
      summary: List all categories with their incident count, sorted by name
      security:
      - BearerAuth: []
      responses:
        '200':
          description: All categories.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /categories/{slug}:
    parameters:
    - name: slug
      in: path
      required: true
      schema:
        type: string
      description: Category slug.
    put:
      operationId: updateCategory
      tags:
      - Categories
      summary: Rename a category and replace its description
      description: The slug never changes, even when the name does.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryWriteRequest'
      responses:
        '200':
          description: The updated category.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`category_name_taken`: another category has this name.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteCategory
      tags:
      - Categories
      summary: Delete a category no incident uses
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Category deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`category_in_use`: incidents still belong to this category.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '500':
          $ref: '#/components/responses/InternalServerError'
