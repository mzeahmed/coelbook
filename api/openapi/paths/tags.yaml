openapi: 3.0.3
info:
  title: Coelbook API
  description: API for the Coelbook incident knowledge-base platform.
  version: 0.1.0
servers:
- url: http://localhost:8080
  description: Local development server
tags:
- name: Tags
  description: Incident tags (requires authentication). Renaming, merging or deleting a tag reindexes the incidents using it.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Envelope:
      description: Standard JSON response wrapper used by every endpoint.
      type: object
      properties:
        code:
          type: integer
          description: HTTP status code.
        success:
          type: boolean
          description: Whether the request succeeded (true for 2xx).
        error:
          type: string
          description: 'Stable, machine-readable error code, present on error responses only. Clients should branch on (and translate) this code rather than parse `message`, whose wording may change.

            '
          enum:
          - invalid_request_body
          - internal_error
          - missing_token
          - invalid_token
          - route_not_found
          - method_not_allowed
          - admin_name_required
          - admin_email_required
          - admin_password_too_short
          - instance_name_required
          - instance_timezone_required
          - instance_locale_required
          - already_initialized
          - credentials_required
          - invalid_credentials
          - email_required
          - reset_token_required
          - password_too_short
          - invalid_reset_token
          - incident_not_found
          - title_required
          - title_too_long
          - invalid_status
          - category_required
          - unknown_category
          - too_many_tags
          - too_many_snippets
          - snippet_title_required
          - snippet_content_required
          - too_many_links
          - link_url_required
          - invalid_link_url
          - category_name_required
          - category_name_too_long
          - category_description_too_long
          - category_name_taken
          - category_not_found
          - category_in_use
          - tag_not_found
          - tag_name_required
          - tag_name_too_long
          - tag_name_invalid
          - tag_exists
          - tag_merge_target_required
          - tag_merge_into_itself
          - first_name_required
          - last_name_required
          - name_too_long
          - invalid_email
          - email_taken
          - current_password_required
          - wrong_current_password
          - instance_name_too_long
          - invalid_timezone
          - invalid_locale
          - not_initialized
        field:
          type: string
          description: 'Path of the request field a validation error is about, present on such errors only. Dots separate nested fields and brackets hold list indexes, e.g. `title` or `snippets[2].content`.

            '
          example: snippets[2].content
        message:
          type: string
          description: Human-readable (English) status message, for developers and logs.
        data:
          description: Payload (varies per endpoint).
      required:
      - code
      - success
      - message
    Tag:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
          description: Value to pass as the `tag` filter of GET /incidents.
        incident_count:
          type: integer
          format: int64
          description: Number of incidents using the tag.
      required:
      - name
      - slug
      - incident_count
    TagRenameRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
          description: New name; the slug is derived from it and changes too.
      required:
      - name
    TagMergeRequest:
      type: object
      properties:
        into:
          type: string
          description: Slug of the tag to merge into.
      required:
      - into
  responses:
    Unauthorized:
      description: Missing or invalid Bearer token / invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 401
            success: false
            error: invalid_credentials
            message: invalid email or password
            data: null
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 500
            success: false
            error: internal_error
            message: internal server error
            data: null
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 400
            success: false
            error: invalid_request_body
            message: invalid request body
            data: null
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 404
            success: false
            error: incident_not_found
            message: incident not found
            data: null
paths:
  /tags:
    get:
      operationId: listTags
      tags:
      - Tags
      summary: List tags with their incident count, sorted by name
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Tags.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - name: include_unused
        in: query
        schema:
          type: boolean
          default: false
        description: Also return tags no incident uses (by default only used tags are returned, as the filters need).
    delete:
      operationId: purgeUnusedTags
      tags:
      - Tags
      summary: Delete every tag no incident uses
      description: '`unused=true` is required, so a bare `DELETE /tags` is never taken for "delete every tag".'
      security: &id001
      - BearerAuth: []
      parameters:
      - name: unused
        in: query
        required: true
        schema:
          type: boolean
          enum:
          - true
      responses:
        '200':
          description: Number of deleted tags.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        deleted:
                          type: integer
                          format: int64
                      required:
                      - deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tags/{slug}:
    parameters:
    - &id005
      name: slug
      in: path
      required: true
      schema:
        type: string
      description: Tag slug.
    put:
      operationId: renameTag
      tags:
      - Tags
      summary: Rename a tag
      description: 'Changes the name and the slug derived from it, and reindexes the incidents using the tag for search. If another tag already has that slug, the request fails with `tag_exists`: merge into it instead.'
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRenameRequest'
      responses:
        '200':
          description: The renamed tag.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Tag'
        '400': &id006
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '404': &id003
          $ref: '#/components/responses/NotFound'
        '500': &id004
          $ref: '#/components/responses/InternalServerError'
        '409':
          description: '`tag_exists`: another tag has this name.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
    delete:
      operationId: deleteTag
      tags:
      - Tags
      summary: Remove a tag from every incident and delete it
      security: *id001
      responses:
        '200':
          description: Tag deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401': *id002
        '404': *id003
        '500': *id004
  /tags/{slug}/merge:
    parameters:
    - *id005
    post:
      operationId: mergeTag
      tags:
      - Tags
      summary: Merge a tag into another one
      description: Every incident tagged with the tag in the URL gets the target tag instead; the merged tag is deleted.
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagMergeRequest'
      responses:
        '200':
          description: The target tag, with its new incident count.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Tag'
        '400': *id006
        '401': *id002
        '404': *id003
        '500': *id004
